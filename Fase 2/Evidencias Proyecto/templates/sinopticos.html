<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinópticos - Calendario</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/sinopticos.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/locales/es.global.min.js"></script>
</head>
<body>

<header>
    <h1 style="font-size:18px; margin:0;">Sinópticos - Vista de calendario</h1>
    <a href="/">Volver al inicio</a>
</header>

<div class="layout">

    <!-- FORMULARIO IZQUIERDA -->
    <div class="panel-form">

        <h2>1. Elegir carrera y semestre</h2>

        <label for="carrera">Carrera</label>
        <select id="carrera"></select>

        <label for="semestre">Semestre</label>
        <select id="semestre"></select>

        <button id="btnCrearSinoptico">Crear sinóptico</button>

        <div id="mensaje"></div>

        <div class="separador">
            <label for="sinopticoExistente">O seguir editando uno existente</label>
            <select id="sinopticoExistente">
                <option value="">-- Seleccione --</option>
            </select>
        </div>

        <div class="separador" id="bloqueAgregarClase" style="display:none;">
            <h2>2. Agregar clase</h2>

            <label for="asignatura">Asignatura</label>
            <select id="asignatura"></select>

            <label for="profesor">Profesor</label>
            <select id="profesor"></select>

            <label for="sala">Sala</label>
            <select id="sala"></select>

            <label for="bloqueHorario">Día y horario</label>
            <select id="bloqueHorario"></select>

            <button id="btnAgregarClase">Agregar al sinóptico</button>
        </div>

    </div>

    <!-- CALENDARIO DERECHA -->
    <div class="panel-calendario">
        <div id="calendar"></div>
    </div>

</div>

<script src="{{ url_for('static', path='js/sinopticos.js') }}"></script>

</body>
</html>
